<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSPC 2026 Email 驗證</title>
    <style>
        :root {
            font-size: min(4vw, 1rem);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #CCCCCC;
        }

        .container {
            display: flex;
            align-items: flex-start;
            flex-direction: column;
            background-color: #FFF;
            border-radius: 1rem;
            padding: 3rem 1rem;
            box-sizing: border-box;
            margin: 1.5rem;
            border-top: 4px solid #343b59;
        }

        .logo {
            height: min(3rem, 8vw);
            border-radius: 0.5rem;
            aspect-ratio: 15229/2905;
        }

        h1 {
            color: #141b39;
        }

        .button {
            font-size: 1.1rem;
            display: block;
            padding: 0.5rem 1.5rem;
            border-radius: 0.5rem;
            color: #141b39;
            background-color: #141b3900;
            border: 0.1rem solid #141b39;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s, background-color 0.2s;
            margin: 1rem 0;
        }

        .button:hover {
            color: #FFF;
            background-color: #141b39;
        }

        .contact-info {
            margin: 1rem 0;
        }

        .contact-info>div {
            margin: 0.5rem 0;
        }

        .contact-info .contact-discord a {
            display: block;
            height: 2rem;
            aspect-ratio: 2647/400;
            padding: 1rem;
            border-radius: 0.5rem;
            background-color: #5865F2;
            margin: 0.5rem 0;
        }

        .plain-info,
        .plain-link {
            font-size: 0.9rem;
            color: #666666;
        }

        .plain-info {
            margin-top: 2rem;
        }

        .plain-link {
            word-break: break-all;
        }
    </style>
</head>
