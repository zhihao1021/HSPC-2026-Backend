<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSPC 2026 學生證驗證通知</title>
    <style>
        :root {
            font-size: min(4vw, 1rem);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #CCCCCC;
        }

        .container {
            background-color: #FFF;
            border-radius: 1rem;
            padding: 3rem 1rem;
            box-sizing: border-box;
            margin: 1.5rem;
            border-top: 4px solid #343b59;
        }

        .logo {
            height: min(3rem, 8vw);
            width: min(15.72rem, 42vw);
            border-radius: 0.5rem;
        }

        .logo img {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        h1 {
            color: #141b39;
        }

        .contact-info {
            margin: 1rem 0;
        }

        .contact-info>div {
            margin: 0.5rem 0;
        }

        .contact-info .contact-discord a {
            display: block;
            height: 2rem;
            width: 14rem;
            padding: 1rem;
            border-radius: 0.5rem;
            background-color: #5865F2;
            margin: 0.5rem 0;
        }

        .plain-info,
        .plain-link {
            font-size: 0.9rem;
            color: #666666;
        }

        .plain-info {
            margin-top: 2rem;
        }

        .plain-link {
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="https://hspc.csie.ncku.edu.tw/logo_color.svg" />
        </div>
        <h1>HSPC 2026 學生證驗證通知</h1>
        <p>您好，您的學生證驗證結果為：$RESULT</p>
        <div class="contact-info">
            <div class="contact-mail">
                如有任何問題，請聯繫： <a href="mailto:$EMAIL" target="_blank">$EMAIL</a>
            </div>
            <div class="contact-discord">
                也歡迎加入官方 Discord 伺服器
                <a href="$DISCORD_LINK" target="_blank">
                    <img src="https://cdn.prod.website-files.com/6257adef93867e50d84d30e2/66e3d718355f9c89eb0fd350_Logo.svg" />
                </a>
            </div>
        </div>
        <p class="plain-info">如果無法點擊按鈕，請透過以下連結進行驗證：</p>
        <a class="plain-link" href="$LINK">$LINK</a>
    </div>
</body>

</html>
